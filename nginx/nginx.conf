upstream backend {
    server planningpoker-server:8081;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=websocket_limit:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Map to handle WebSocket upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Map to handle forwarded protocol (fallback to https if behind SSL proxy)
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' https;
}

# Privacy: access logs deliberately omit client IPs (see PRIVACY.md).
log_format no_ip '$time_iso8601 "$request" $status $body_bytes_sent '
                 '"$http_user_agent" "$http_referer"';

server {
    listen 80;
    server_name _;
    
    # Privacy: log requests without IP addresses. Rate-limit rejections are
    # demoted to warn level so they don't leak IPs into the error log either.
    access_log /var/log/nginx/access.log no_ip;
    limit_req_log_level warn;
    limit_conn_log_level warn;
    
    # Trust X-Forwarded-For only from private upstream proxy ranges.
    # Adjust these to match your reverse-proxy LAN if needed.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Strict CSP for the static SPA (this is the header that governs the HTML
    # document). Keep in sync with the helmet CSP in server/src/index.js —
    # proxied /api responses therefore carry both headers, which only ever
    # restricts further, never loosens. Verified against the Vite build (M1):
    #   script-src 'self'     — single external bundle, no inline scripts
    #                           (JSON-LD is non-executable, CSP-exempt)
    #   style-src 'unsafe-inline' — React inline style attributes
    #   img-src data:         — webpack-inlined assets
    #   media-src data:       — base64 sound effect in useSessionSocket.js
    #   connect-src 'self'    — API and Socket.IO are same-origin in prod
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    
    # Gzip compression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        application/javascript
        application/json
        text/css
        text/javascript
        text/plain
        text/xml;
    
    # API routes
    location /api/ {
        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 10;
        
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Socket.IO
    location /socket.io/ {
        # Rate limiting for websockets
        limit_req zone=websocket_limit burst=50 nodelay;
        limit_conn conn_limit 10;
        
        proxy_pass http://backend;
        proxy_http_version 1.1;
        
        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Forward original request headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        
        # WebSocket specific settings
        proxy_buffering off;
        proxy_cache off;
        proxy_redirect off;
        proxy_request_buffering off;
        
        # WebSocket timeouts - long enough for periodic heartbeats,
        # but not so long that dead sockets linger forever.
        proxy_connect_timeout 1h;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
    }
    
    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Some AI audits probe /ai-catalog.json at the root; serve the same
    # manifest as the canonical /.well-known/ai-catalog.json (ARD spec).
    location = /ai-catalog.json {
        root /usr/share/nginx/html;
        try_files /.well-known/ai-catalog.json =404;
    }
    
    # Pre-rendered public pages (M3): serve full static HTML so non-JS
    # crawlers (GPTBot, ClaudeBot, PerplexityBot, …) see real content. Exact
    # matches so /about and /join never fall through to the SPA shell.
    location = /about {
        root /usr/share/nginx/html;
        try_files /about/index.html =404;
    }
    location = /join {
        root /usr/share/nginx/html;
        try_files /join/index.html =404;
    }
    # Canonicalise the trailing-slash variants to the sitemap URLs.
    location = /about/ {
        return 301 /about;
    }
    location = /join/ {
        return 301 /join;
    }

    # Static files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # The SPA shell (generic, noindex meta) is the fallback for /session/*
        # and unknown routes; the pre-rendered public pages resolve as files.
        try_files $uri $uri/ /app.html;
        
        # Cache images for 1 day to allow theme updates to propagate
        location ~* \.(png|jpg|jpeg|webp|gif|svg|ico)$ {
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
        }
        
        # Cache JS/CSS/fonts for 1 year (content-hashed filenames)
        location ~* \.(js|css|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}