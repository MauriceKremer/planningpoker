services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    image: planningpoker-server:current
    container_name: planningpoker-server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8081
      # Overridable for local testing: CLIENT_URL=... docker compose
      # -f docker-compose.prod.yml up -d. Comma-separated whitelist — the
      # canonical domain plus the local verify port both serve this backend.
      - CLIENT_URL=${CLIENT_URL:-https://planningpoker.bytecoder.nl,http://localhost:4080}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - planningpoker-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
      # The client source is a named build context: the client bundle is
      # compiled inside the nginx image itself (nginx/Dockerfile), so one
      # image ships nginx + config + the exact static build. No copy
      # container, no dockerdata/client-build bind mount.
      additional_contexts:
        client: ./client
    image: planningpoker-nginx:current
    container_name: planningpoker-nginx
    restart: unless-stopped
    ports:
      - "4080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx-main.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - planningpoker-network

networks:
  planningpoker-network:
    driver: bridge