services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    container_name: planningpoker-server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8081
      - CLIENT_URL=https://planningpoker.bytecoder.nl
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - planningpoker-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=https://planningpoker.bytecoder.nl/api
        - REACT_APP_SOCKET_URL=https://planningpoker.bytecoder.nl
    container_name: planningpoker-client
    restart: unless-stopped
    volumes:
      - ./dockerdata/client-build:/output
    networks:
      - planningpoker-network

  nginx:
    image: nginx:alpine
    container_name: planningpoker-nginx
    restart: unless-stopped
    ports:
      - "4080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx-main.conf:/etc/nginx/nginx.conf:ro
      - ./dockerdata/client-build:/usr/share/nginx/html:ro
    depends_on:
      server:
        condition: service_healthy
      client:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - planningpoker-network

networks:
  planningpoker-network:
    driver: bridge