services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: planningpoker-server
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - NODE_ENV=production
      - PORT=8081
      - CLIENT_URL=http://localhost:3000
    volumes:
      - ./server:/app
    user: "node"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: planningpoker-client
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:8081/api
      - REACT_APP_SOCKET_URL=http://localhost:8081
    depends_on:
      server:
        condition: service_healthy


networks:
  default:
    name: planningpoker-network