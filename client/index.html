<!DOCTYPE html>
<html lang="en" data-theme="autumn">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3E2723" />

    <!--
      Route-specific meta. scripts/prerender.mjs (M3) replaces everything
      between the sentinels with the pre-rendered route's react-helmet-async
      output, so /, /about and /join each ship their own title, description,
      robots and canonical in the raw HTML (crawlers don't run JavaScript).
      Keep the sentinels in place.
    -->
    <!-- seo:start -->
    <title>Free Online Planning Poker – No Signup, No Ads, No Tracking</title>
    <meta name="title" content="Free Online Planning Poker – No Signup, No Ads, No Tracking" />
    <meta name="description" content="Free real-time Planning Poker for Agile teams. No signup, no ads, no tracking. Estimate with Fibonacci & T-shirt cards." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://planningpoker.bytecoder.nl/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:url" content="https://planningpoker.bytecoder.nl/" />
    <meta property="og:title" content="Free Online Planning Poker – No Signup, No Ads, No Tracking" />
    <meta property="og:description" content="Free real-time Planning Poker for Agile teams. No signup, no ads, no tracking. Estimate with Fibonacci & T-shirt cards." />
    <meta property="og:image" content="https://planningpoker.bytecoder.nl/images/og-image.jpg?v=autumn-2026" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Playful Planning Poker cards over a warm seasonal backdrop" />

    <!-- Twitter -->
    <meta property="twitter:url" content="https://planningpoker.bytecoder.nl/" />
    <meta property="twitter:title" content="Free Online Planning Poker – No Signup, No Ads, No Tracking" />
    <meta property="twitter:description" content="Free real-time Planning Poker for Agile teams. No signup, no ads, no tracking. Estimate with Fibonacci & T-shirt cards." />
    <meta property="twitter:image" content="https://planningpoker.bytecoder.nl/images/twitter-card.jpg?v=autumn-2026" />
    <meta property="twitter:image:alt" content="Playful Planning Poker cards over a warm seasonal backdrop" />
    <!-- seo:end -->

    <!-- Site-level meta (identical on every route) -->
    <meta name="author" content="Planning Poker" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Planning Poker" />
    <meta property="og:locale" content="en_US" />
    <meta property="twitter:card" content="summary_large_image" />

    <!-- Agentic Resource Discovery manifest (ARD) -->
    <link rel="ai-catalog" href="/.well-known/ai-catalog.json" type="application/ai-catalog+json" />

    <!-- Additional SEO -->
    <meta name="application-name" content="Planning Poker" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Planning Poker" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Schema.org structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Planning Poker",
      "description": "Free, privacy-first Planning Poker tool for Agile teams to estimate story points collaboratively. No signup, no ads, no tracking.",
      "url": "https://planningpoker.bytecoder.nl/",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Any",
      "slogan": "Privacy first, no ads — a passion project for Agile teams",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Real-time collaboration",
        "Multiple card sets (Fibonacci, Modified Fibonacci, Mike Cohn, T-shirt, custom)",
        "No signup required",
        "No ads",
        "No tracking or analytics",
        "Ephemeral sessions — all data auto-deleted within 24 hours",
        "Session persistence",
        "Mobile friendly",
        "Seasonal playful themes"
      ],
      "browserRequirements": "Requires JavaScript. Requires HTML5."
    }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app. Planning Poker is a free, privacy-first estimation tool for Agile teams — no signup, no ads, no tracking.</noscript>
    <div id="root"><!-- prerender:start -->
      <!--
        Fallback for the pure-SPA shell (build/app.html: /session/* and unknown
        routes). The public pages are replaced by scripts/prerender.mjs with
        fully pre-rendered HTML; React replaces whatever is here on mount.
      -->
      <p style="max-width: 40rem; margin: 2rem auto; padding: 0 1rem; text-align: center; font-family: system-ui, sans-serif; color: #3E2723;">
        Loading Planning Poker…
      </p>
    <!-- prerender:end --></div>

    <!-- Vite entry module (CRA injected this automatically; Vite requires it in the HTML) -->
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
